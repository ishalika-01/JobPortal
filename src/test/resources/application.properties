spring.application.name=SpringJobPortalRevisionJWT
server.servlet.session.cookie.same-site=strict
server.port=8081

# Test database configuration for CI and local test runs
spring.datasource.url=jdbc:h2:mem:jobportal_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT configuration
jwt.secret=${JWT_SECRET:TmV3U2VjcmV0S2V5Rm9ySldUU2lnbmluZ1B1cnBvc2VzMTIzNDU2Nzg=}
jwt.expiration=3600000
